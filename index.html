<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --border: #dde1ec;
    --accent: #2a7d3f;
    --warn: #c47a00;
    --orange: #d35400;
    --danger: #c0392b;
    --text: #1a1d2e;
    --muted: #6b7391;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ───────── Mobile-first layout: header → map → panel (page scrolls) ───────── */
  header {
    position: sticky; top: 0; z-index: 1000;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
  }
  .logo { font-weight: 800; font-size: 20px; color: var(--accent); }
  .tagline { font-size: 11px; color: var(--muted); display: none; }
  .status-dot {
    margin-left: auto; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px rgba(42,125,63,0.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #map {
    width: 100%;
    height: 42vh;
    height: 42dvh;
    min-height: 220px;
    background: #e8ecf2;
  }

  #sidebar {
    background: var(--panel);
    padding-bottom: calc(16px + var(--safe-b));
  }

  .search-section {
    padding: 14px calc(14px + var(--safe-r)) 14px calc(14px + var(--safe-l));
    border-bottom: 1px solid var(--border);
  }
  .field-label {
    font-size: 11px; letter-spacing: 0.1em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 8px;
  }
  .input-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .origin-wrap { display: flex; gap: 8px; }
  .route-input {
    flex: 1; min-width: 0; width: 100%;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 16px; /* 16px stops iOS Safari from zooming on focus */
    border-radius: 8px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .route-input:focus { border-color: var(--accent); background: #fff; }
  .route-input::placeholder { color: var(--muted); }
  .route-input.gps { color: var(--accent); font-weight: 700; }
  .gps-btn {
    flex-shrink: 0; width: 48px;
    border: 1px solid var(--border); background: var(--bg);
    border-radius: 8px; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .gps-btn.active { background: rgba(42,125,63,0.12); border-color: var(--accent); }
  .gps-btn:disabled { opacity: 0.5; }
  .go-btn {
    width: 100%; min-height: 48px;
    background: var(--accent); color: #fff; border: none;
    font-family: inherit; font-weight: 700; font-size: 15px; letter-spacing: 0.03em;
    border-radius: 8px; cursor: pointer; touch-action: manipulation;
  }
  .go-btn:active { opacity: 0.85; }
  .go-btn:disabled { opacity: 0.45; }

  .route-summary {
    display: none; flex-wrap: wrap; gap: 6px 16px;
    padding: 10px calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));
    background: var(--bg); border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .route-summary.visible { display: flex; }
  .route-summary strong { color: var(--text); }

  #stations-panel { padding: 10px calc(10px + var(--safe-r)) 10px calc(10px + var(--safe-l)); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 28px 12px; color: var(--muted);
    font-size: 14px; text-align: center; line-height: 1.6;
  }
  .empty-icon { font-size: 34px; opacity: 0.35; }
  .empty-note { font-size: 11px; opacity: 0.8; }

  .section-header {
    font-size: 11px; letter-spacing: 0.08em; color: var(--muted);
    text-transform: uppercase; padding: 4px 4px 8px;
  }

  /* ───────── Station table (4 columns, fits 320px) ───────── */
  .stations-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  .stations-table col.c-name { width: 37%; }
  .stations-table col.c-rt   { width: 17%; }
  .stations-table col.c-at   { width: 17%; }
  .stations-table col.c-surf { width: 29%; }
  .stations-table thead th {
    font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); text-align: left; font-weight: 700;
    padding: 6px 4px; border-bottom: 2px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stations-table thead th.num, .stations-table td.num { text-align: right; padding-right: 8px; }
  .stations-table tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
  .stations-table tbody tr.active { background: #e6f0ea; }
  .stations-table tbody tr.slippery { background: #fdecea; }
  .stations-table tbody tr.stale,
  .stations-table tbody tr.stale.slippery { background: #f2f3f6; }
  .stations-table tbody tr.stale.active { background: #e6e8ee; }
  .stations-table tbody tr.stale .td-temp,
  .stations-table tbody tr.stale .td-name { color: #9aa0b4; }
  .stations-table tbody tr.stale .surface-pill { background: rgba(122,130,160,0.12); color: #9aa0b4; }
  .td-time.old { color: var(--danger); font-weight: 700; }
  .stations-table tbody tr.slippery.active { background: #fad6d3; }
  .stations-table td { padding: 10px 4px; vertical-align: middle; overflow-wrap: anywhere; }

  .td-name { font-weight: 700; line-height: 1.3; }
  .td-time { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .td-temp { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .td-temp.ok     { color: var(--accent); }
  .td-temp.warn   { color: var(--warn); }
  .td-temp.orange { color: var(--orange); }
  .td-temp.danger { color: var(--danger); }

  .surface-pill {
    display: inline-block; padding: 3px 6px; border-radius: 4px;
    font-size: 12px; font-weight: 700; line-height: 1.25;
  }
  .pill-ok      { background: rgba(42,125,63,0.12);   color: var(--accent); }
  .pill-warn    { background: rgba(196,122,0,0.13);   color: var(--warn); }
  .pill-orange  { background: rgba(211,84,0,0.13);    color: var(--orange); }
  .pill-danger  { background: rgba(192,57,43,0.15);   color: var(--danger); }
  .pill-unknown { background: rgba(122,130,160,0.14); color: var(--muted); }

  .next-chip {
    display: inline-block; background: var(--accent); color: #fff;
    font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    padding: 2px 5px; border-radius: 3px; margin-bottom: 3px;
  }

  /* ───────── Overlays ───────── */
  #loading {
    position: fixed; inset: 0; z-index: 3000;
    background: rgba(244,246,250,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #loading.show { opacity: 1; pointer-events: all; }
  .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--muted); padding: 0 24px; text-align: center; }

  #toast {
    position: fixed; left: 50%; z-index: 3001;
    bottom: calc(16px + var(--safe-b));
    transform: translateX(-50%) translateY(150%);
    background: var(--danger); color: #fff;
    padding: 12px 18px; border-radius: 8px;
    font-size: 14px; text-align: center; line-height: 1.4;
    width: max-content; max-width: calc(100vw - 32px);
    opacity: 0; visibility: hidden;
    transition: transform 0.25s, opacity 0.25s, visibility 0.25s;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }

  .leaflet-popup-content { font-family: Arial, Helvetica, sans-serif; font-size: 13px; }


  /* ───────── Planning screen: driving controls ───────── */
  .drive-row { display: flex; gap: 10px; align-items: stretch; margin-top: 10px; }
  .drive-btn {
    flex: 1; min-height: 52px; border: none; border-radius: 8px; cursor: pointer;
    background: #1a1d2e; color: #fff; font-family: inherit; font-weight: 700; font-size: 16px;
    touch-action: manipulation;
  }
  .drive-btn:disabled { opacity: 0.5; }
  .sim-toggle {
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--muted);
    background: var(--bg); cursor: pointer; user-select: none;
  }
  .sim-toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

  /* ───────── Driving mode — design B (fixed layout, no scrolling, no animation) ───────── */
  #drive {
    --bg: #131519; --fg: #ECEAE3; --fg2: #C9C7C0; --btn: #23262D; --btn-border: #6A6E78; --empty: #2A2D33;
    --none-bg: #4A4E57; --none-fg: #ECEAE3; --bad: #FF8F80; --brand: #8FD3A8;
    position: fixed; inset: 0; z-index: 5000;
    background: var(--bg); color: var(--fg);
    font-family: Arial, Helvetica, sans-serif;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
    display: none;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto auto;
    gap: 8px; overflow: hidden;
    padding: calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));
  }
  #drive.light {
    --bg: #F4F1EA; --fg: #1A1D22; --fg2: #3A3F4B; --btn: #E4E0D6; --btn-border: #A8ABB3; --empty: #D6D2C8;
    --none-bg: #6B6F78; --none-fg: #F4F1EA; --bad: #B3261E; --brand: #2A7D3F;
  }
  #drive.on { display: grid; }
  #drive > * { min-width: 0; min-height: 0; }
  .d-fit { display: block; white-space: nowrap; overflow: hidden; text-overflow: clip; line-height: 1.08; }
  .d-top { display: flex; align-items: center; gap: 10px; }
  .d-top-text { flex: 1; min-width: 0; }
  .d-brand { font-weight: 700; color: var(--brand); font-size: 20px; }
  .d-dest { color: var(--fg2); font-size: 18px; }
  .d-theme {
    width: 56px; height: 56px; flex-shrink: 0; border-radius: 14px; border: 2px solid var(--btn-border);
    background: var(--btn); color: var(--fg); display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation; padding: 0;
  }
  .d-theme svg { width: 28px; height: 28px; }
  .d-band {
    border-radius: 18px; padding: 8px 12px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto;
    column-gap: 10px; align-content: center; overflow: hidden;
  }
  .d-band .b-word  { grid-column: 1 / span 2; grid-row: 1; font-weight: 700; display: flex; align-items: center; gap: 0.3em; min-width: 0; }
  .d-band .b-word svg { width: 1em; height: 1em; flex-shrink: 0; display: block; }
  .d-band .b-word .b-wtext { min-width: 0; flex: 1; }
  .d-band .b-dist  { grid-column: 1; grid-row: 2; font-weight: 700; }
  .d-band .b-det   { grid-column: 1; grid-row: 3; }
  .d-band .b-temp  { grid-column: 2; grid-row: 2 / span 2; font-weight: 700; text-align: right; align-self: center; line-height: 1; }
  .b-ice   { background: #B3261E; color: #FFF4EF; }
  .b-warn  { background: #E0A526; color: #1C1500; }
  .b-ok    { background: #2E5E43; color: #F4F1EA; }
  .b-none  { background: var(--none-bg); color: var(--none-fg); }
  .b-empty { background: transparent; border: 2px dashed var(--empty); color: var(--fg2); }
  .d-meta { text-align: center; color: var(--fg2); }
  .d-meta.bad { color: var(--bad); font-weight: 700; }
  .d-stop {
    min-height: 60px; border-radius: 16px; border: 2px solid var(--btn-border);
    background: var(--btn); color: var(--fg); font-family: inherit; font-weight: 700; font-size: 32px;
    cursor: pointer; touch-action: manipulation;
  }

  /* ───────── Desktop / tablet: sidebar left, map right ───────── */
  @media (min-width: 768px) {
    body {
      height: 100vh; height: 100dvh; overflow: hidden;
      display: grid;
      grid-template-columns: 400px 1fr;
      grid-template-rows: auto 1fr;
    }
    header { position: static; grid-column: 1 / -1; grid-row: 1; padding: 14px 24px; }
    .logo { font-size: 22px; }
    .tagline { display: block; }
    #map { grid-column: 2; grid-row: 2; height: 100%; min-height: 0; }
    #sidebar {
      grid-column: 1; grid-row: 2; min-height: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      padding-bottom: 0;
    }
    #stations-panel { flex: 1; overflow-y: auto; padding: 12px; }
    .stations-table tbody tr:hover { background: #eef1f9; }
    .stations-table tbody tr.slippery:hover { background: #fad6d3; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Teeolud</div>
  </div>
  <div class="status-dot" title="Reaalajaandmed"></div>
</header>

<div id="map"></div>

<div id="sidebar">
  <div class="search-section">
    <div class="input-row">
      <div class="origin-wrap">
        <input type="text" id="origin" class="route-input" placeholder="Alguspunkt, nt Tallinn" value="Tallinn"
               autocomplete="off" autocapitalize="words" enterkeyhint="next">
        <button type="button" class="gps-btn" id="gps-btn" title="Kasuta minu asukohta" aria-label="Kasuta minu asukohta">📍</button>
      </div>
      <input type="text" id="dest" class="route-input" placeholder="Sihtpunkt, nt Tartu" value="Tartu"
             autocomplete="off" autocapitalize="words" enterkeyhint="go">
    </div>
    <button type="button" class="go-btn" id="go-btn">▶ PLANEERI MARSRUUT</button>
    <div class="drive-row">
      <button type="button" class="drive-btn" id="drive-btn">Sõida</button>
      <label class="sim-toggle"><input type="checkbox" id="sim-toggle"> Simuleeri</label>
    </div>
  </div>

  <div class="route-summary" id="route-summary">
    <span>🛣 <strong id="sum-dist">—</strong></span>
    <span>⏱ <strong id="sum-time">—</strong></span>
    <span>🌡 <strong id="sum-stations">—</strong></span>
  </div>

  <div id="stations-panel">
    <div class="empty-state">
      <div class="empty-icon">🌧</div>
      <div>Sisesta marsruut, et näha<br>teeilmajaamu oma teel.</div>
    </div>
  </div>
</div>

<div id="drive" role="main" aria-live="polite">
  <div class="d-top">
    <div class="d-top-text">
      <div class="d-dest d-fit" id="d-dest">—</div>
    </div>
    <button type="button" class="d-theme" id="d-theme" aria-label="Vaheta heledat ja tumedat"></button>
  </div>
  <div class="d-band b-empty" id="d-band0">
    <div class="b-word"><span class="b-ico" aria-hidden="true"></span><span class="d-fit b-wtext"></span></div>
    <div class="b-det d-fit"></div>
    <div class="b-dist d-fit"></div>
    <div class="b-temp d-fit"></div>
  </div>
  <div class="d-band b-empty" id="d-band1">
    <div class="b-word"><span class="b-ico" aria-hidden="true"></span><span class="d-fit b-wtext"></span></div>
    <div class="b-det d-fit"></div>
    <div class="b-dist d-fit"></div>
    <div class="b-temp d-fit"></div>
  </div>
  <div class="d-band b-empty" id="d-band2">
    <div class="b-word"><span class="b-ico" aria-hidden="true"></span><span class="d-fit b-wtext"></span></div>
    <div class="b-det d-fit"></div>
    <div class="b-dist d-fit"></div>
    <div class="b-temp d-fit"></div>
  </div>
  <div class="d-meta d-fit" id="d-meta">Andmed – · GPS …</div>
  <button type="button" class="d-stop" id="d-stop">Lõpeta</button>
</div>

<div id="loading"><div class="spinner"></div><div class="loading-text" id="loading-text">Laen…</div></div>
<div id="toast" role="alert"></div>

<script>
(function () {
  'use strict';

  // Live Tarktee feed (the 'tram' folder) first; the old feed is a fallback.
  // outSR=3301 keeps coordinates in the Estonian grid the app converts from.
  var TARKTEE_QUERY = '/MapServer/0/query?where=1%3D1&outFields=*&outSR=3301&f=json&resultRecordCount=1000';
  var TARKTEE_URLS = [
    'https://tarktee.ee/tarktee/rest/services/tram/road_weather_stations' + TARKTEE_QUERY,
    'https://tarktee.ee/tarktee/rest/services/road_weather_stations' + TARKTEE_QUERY
  ];
  // Road cameras: many camera sites carry weather readings (e.g. Tõrenurme)
  var TARKTEE_CAMERA_URLS = [
    'https://tarktee.ee/tarktee/rest/services/tram/road_cameras' + TARKTEE_QUERY,
    'https://tarktee.ee/tarktee/rest/services/road_cameras' + TARKTEE_QUERY
  ];
  var MAX_DIST_M = 300;       // stations within 300 m of the route
  var TIMEOUT_MS = 20000;

  // ─── EPSG:3301 (Estonian grid) → WGS84 ────────────────────────────────────
  function lcc3301ToWgs84(x, y) {
    var a = 6378137.0, f = 1 / 298.257222101;
    var b = a * (1 - f), e2 = 1 - (b * b) / (a * a), e = Math.sqrt(e2);
    var phi1 = 58.0 * Math.PI / 180, phi2 = 59.333333333 * Math.PI / 180;
    var phi0 = 57.517553 * Math.PI / 180, lam0 = 24.0 * Math.PI / 180;
    var FE = 500000, FN = 6375000;
    function m(p) { return Math.cos(p) / Math.sqrt(1 - e2 * Math.pow(Math.sin(p), 2)); }
    function t(p) { var s = Math.sin(p); return Math.tan(Math.PI / 4 - p / 2) / Math.pow((1 - e * s) / (1 + e * s), e / 2); }
    var m1 = m(phi1), m2 = m(phi2), t1 = t(phi1), t2 = t(phi2), t0 = t(phi0);
    var n = (Math.log(m1) - Math.log(m2)) / (Math.log(t1) - Math.log(t2));
    var F = m1 / (n * Math.pow(t1, n)), r0 = a * F * Math.pow(t0, n);
    var xp = x - FE, yp = y - FN;
    var r = Math.sign(n) * Math.sqrt(xp * xp + (r0 - yp) * (r0 - yp));
    var theta = Math.atan2(xp, r0 - yp);
    var tt = Math.pow(r / (a * F), 1 / n);
    var phi = Math.PI / 2 - 2 * Math.atan(tt);
    for (var i = 0; i < 10; i++) {
      var s = Math.sin(phi);
      phi = Math.PI / 2 - 2 * Math.atan(tt * Math.pow((1 - e * s) / (1 + e * s), e / 2));
    }
    return [phi * 180 / Math.PI, (theta / n + lam0) * 180 / Math.PI];
  }

  // ─── Map ──────────────────────────────────────────────────────────────────
  var map = L.map('map', { zoomControl: true, tap: true });
  var CARTO_KEY = 'cb1_5g16_1_a71c6908e364ee350897159a';
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=' + CARTO_KEY, {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18
  }).addTo(map);
  map.setView([58.7, 25.3], 7);

  var routeLayer = null;
  var stationMarkers = [];
  var gpsMarker = null;
  var gpsCoord = null;        // [lng, lat] when "my location" is used

  function stationIcon(color) {

      className: '',
      html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color +

  // Keep Leaflet sized correctly on rotation / browser bar changes

  // ─── Network helper with timeout ──────────────────────────────────────────
  // Timeout via Promise.race (no AbortSignal: some embedded viewers can't pass it on)
  // Wraps fetch so a network failure names the service that failed
  function fetchFrom(label, url, opts) {
    return fetchWithTimeout(url, opts).catch(function (err) {
      if (err && err.name === 'AbortError') throw new Error(label + ': päring aegus');
      throw new Error(label + ': ühendus ebaõnnestus (' + (err && err.message || 'viga') + ')');
    });
  }

  function fetchWithTimeout(url, opts) {
    var id;
    var timeout = new Promise(function (_, reject) {
      id = setTimeout(function () {
        var e = new Error('Päring aegus. Proovi uuesti.');
        e.name = 'AbortError';
        reject(e);
      }, TIMEOUT_MS);
    });
    return Promise.race([fetch(url, opts || {}), timeout])
      .finally(function () { clearTimeout(id); });
  }

  // ─── OpenRouteService ─────────────────────────────────────────────────────
  async function geocode(text) {
    var url = 'https://api.heigit.org/pelias/v1/search?api_key=' + ORS_KEY +
              '&text=' + encodeURIComponent(text) + '&boundary.country=EE&size=1';
    var r = await fetchFrom('Asukohaotsing (OpenRouteService)', url);
    if (!r.ok) throw new Error('Asukohaotsing (OpenRouteService): HTTP ' + r.status);
    var d = await r.json();
    if (!d.features || !d.features.length) throw new Error('Asukohta ei leitud: ' + text);
    return d.features[0].geometry.coordinates; // [lng, lat]
  }

  async function getRoute(oCoord, dCoord) {
    var r = await fetchFrom('Marsruut (OpenRouteService)', 'https://api.heigit.org/openrouteservice/v2/directions/driving-car/geojson', {
      method: 'POST',
      headers: { 'Authorization': ORS_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ coordinates: [oCoord, dCoord] })
    });
    if (!r.ok) {
      var e = await r.json().catch(function () { return {}; });
      throw new Error('Marsruut (OpenRouteService): ' + ((e.error && e.error.message) || 'HTTP ' + r.status));
    }
    return r.json();
  }

  // ─── Tarktee (unchanged endpoint) ─────────────────────────────────────────
  async function fetchLayer(urls) {
    var lastErr;
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetchWithTimeout(urls[i]);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var data = await r.json();
        if (data.error) throw new Error(data.error.message || 'teenuse viga');
        if (!data.features || !data.features.length) throw new Error('andmed puuduvad');
        return data;
      } catch (err) {
        lastErr = err;   // try the next address
      }
    }
    throw lastErr || new Error('viga');
  }

  async function fetchWeatherStations() {
    try {
      return await fetchLayer(TARKTEE_URLS);
    } catch (err) {
      throw new Error('Tarktee: andmete laadimine ebaõnnestus (' + (err && err.message || 'viga') + ')');
    }
  }

  // Camera layer is a bonus: if it fails, the app still shows weather stations
  async function fetchCameraStations() {
    try {
      var data = await fetchLayer(TARKTEE_CAMERA_URLS);
      return data.features.filter(function (f) {
        var a = f.attributes || {};
        return a.road_temp != null || a.air_temp != null || a.road_status;
      }).map(function (f) {
        var a = f.attributes;
        return {
          geometry: f.geometry,
          attributes: {
            site_name: a.site_name,
            road_temp: a.road_temp,
            air_temp: a.air_temp,
            road_status: a.road_status,
            measurement_time: a.weather_time,
            _camera: true,
            _via: a.closest_weather_station,
            _viaDist: a.distance
          }
        };
      });
    } catch (err) {
      return [];
    }
  }

  // ─── Geometry ─────────────────────────────────────────────────────────────
  // Distance from point to segment, plus how far along the segment (0..1) the closest point is
  function ptSeg(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay;
    var t = (dx === 0 && dy === 0) ? 0 :
      Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
    return { d: Math.hypot(px - ax - t * dx, py - ay - t * dy), t: t };
  }
  var LAT_M = 111320, LNG_M = 111320 * Math.cos(58.8 * Math.PI / 180);
  // routeIdx = segment index + position within it, so stations sort in driving order
  function stationDistToRoute(sLat, sLng, coords) {
    var best = { d: Infinity, pos: 0 };
    for (var i = 0; i < coords.length - 1; i++) {
      var A = coords[i], B = coords[i + 1];
      var r = ptSeg(sLng * LNG_M, sLat * LAT_M, A[0] * LNG_M, A[1] * LAT_M, B[0] * LNG_M, B[1] * LAT_M);
      if (r.d < best.d - 0.01) best = { d: r.d, pos: i + r.t };
    }
    return { distM: best.d, routeIdx: best.pos };
  }

  // ─── Conditions (official Tarktee wording) ────────────────────────────────
  function surfaceLabel(val) {
    if (val === null || val === undefined || val === '') return { text: 'Teadmata', cls: 'unknown' };
    switch (String(val).toUpperCase()) {
      case 'DRY':                return { text: 'Kuiv',        cls: 'ok' };
      case 'MOIST':              return { text: 'Niiske',      cls: 'warn' };
      case 'WET':                return { text: 'Märg',        cls: 'warn' };
      case 'MOIST_AND_CHEMICAL': return { text: 'Soolaniiske', cls: 'warn' };
      case 'WET_AND_CHEMICAL':   return { text: 'Soolamärg',   cls: 'warn' };
      default: {
        var c = String(val).toLowerCase().replace(/_/g, ' ');
        return { text: c.charAt(0).toUpperCase() + c.slice(1), cls: 'unknown' };
      }
    }
  }
  function isSlippery(sc) { return sc.cls === 'danger' || sc.cls === 'orange'; }
  function tempColor(t) {
    if (t === null || t === undefined || isNaN(t)) return '';
    if (t < -5) return 'danger';
    if (t < 0)  return 'orange';
    if (t < 3)  return 'warn';
    return 'ok';
  }
  function stationIconColor(sc, roadTemp) {
    if (sc.cls === 'danger') return '#c0392b';
    if (sc.cls === 'orange') return '#d35400';
    if (roadTemp !== null && roadTemp < 0) return '#d35400';
    if (sc.cls === 'warn') return '#c47a00';
    return '#2a7d3f';
  }
  function fmtTemp(t) { return t === null || isNaN(t) ? '—' : t.toFixed(1); }
  var STALE_MS = 60 * 60 * 1000;   // readings older than 1 h are treated as outdated
  function pad(n) { return ('0' + n).slice(-2); }
  function isStale(ms) { return !ms || (Date.now() - ms) > STALE_MS; }
  // "kell 14:30" for recent readings, "25.11 14:30" otherwise
  function fmtTime(ms) {
    if (!ms) return 'aeg teadmata';
    var d = new Date(ms), now = new Date();
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var sameDay = d.toDateString() === now.toDateString();
    return sameDay ? 'kell ' + hm : pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + hm;
  }
  function fmtAge(ms) {
    if (!ms) return '';
    var min = Math.round((Date.now() - ms) / 60000);
    if (min < 60) return min + ' min tagasi';
    var h = Math.round(min / 60);
    if (h < 48) return h + ' h tagasi';
    return Math.round(h / 24) + ' päeva tagasi';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }


  // ─── Station matching (shared by planning and driving mode) ──────────────
  function buildMatched(stationFeatures, cameraFeatures, coords) {
    // Skip camera sites that just repeat a weather station already in the list
    var stationNames = {};
    stationFeatures.forEach(function (f) {
      if (f.attributes && f.attributes.site_name) stationNames[f.attributes.site_name.toLowerCase()] = true;
    });
    var seenCam = {};
    var cams = cameraFeatures.filter(function (f) {
      var a = f.attributes;
      var own = (a.site_name || '').toLowerCase();
      var via = (a._via || '').toLowerCase();
      if (stationNames[own]) return false;                       // same site, same name
      if (via && stationNames[via] && !a._viaDist) return false;  // same site, other name
      if (seenCam[own]) return false;
      seenCam[own] = true;
      return true;
    });
    var matched = [];
    stationFeatures.concat(cams).forEach(function (f) {
      var g = f.geometry;
      if (!g) return;
      var ll = lcc3301ToWgs84(g.x, g.y);
      if (isNaN(ll[0]) || isNaN(ll[1])) return;
      var res = stationDistToRoute(ll[0], ll[1], coords);
      if (res.distM <= MAX_DIST_M) {
        matched.push({ attributes: f.attributes, _lat: ll[0], _lng: ll[1], _distM: res.distM, _routeIdx: res.routeIdx });
      }
    });
    matched.sort(function (a, b) { return a._routeIdx - b._routeIdx; });
    return matched;
  }

  // Route with cumulative distances (metres) for along-the-route measuring
  var currentRoute = null, routeStations = [], lastFetchOk = 0;
  function makeRoute(coords, summary) {
    var cum = [0], seg = [];
    for (var i = 0; i < coords.length - 1; i++) {
      var A = coords[i], B = coords[i + 1];
      var d = Math.hypot((B[0] - A[0]) * LNG_M, (B[1] - A[1]) * LAT_M);
      seg.push(d); cum.push(cum[i] + d);
    }
    var total = cum[cum.length - 1];
    var avg = (summary && summary.duration > 0) ? summary.distance / summary.duration : 22; // m/s
    return { coords: coords, cum: cum, seg: seg, total: total, avgSpeed: avg };
  }
  function alongFromIdx(route, pos) {
    var i = Math.min(Math.floor(pos), route.seg.length - 1);
    return route.cum[i] + (pos - i) * route.seg[i];
  }
  function withAlong(matched, route) {
    return matched.map(function (m) { m._along = alongFromIdx(route, m._routeIdx); return m; });
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function renderStations(stations) {
    var panel = document.getElementById('stations-panel');
    panel.innerHTML = '';
    if (!stations.length) {
      panel.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>' +
        '<div>Marsruudi lähedal (300 m) ei leitud ühtegi teeilmajaama.</div></div>';
      return;
    }

    var hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.textContent = stations.length + (stations.length === 1 ? ' jaam' : ' jaama') + ' sõidusuunas';
    panel.appendChild(hdr);

    var table = document.createElement('table');
    table.className = 'stations-table';
    table.innerHTML =
      '<colgroup><col class="c-name"><col class="c-rt"><col class="c-at"><col class="c-surf"></colgroup>' +
      '<thead><tr><th>Jaam</th><th class="num">Tee °C</th><th class="num">Õhk °C</th><th>Teekate</th></tr></thead>' +
      '<tbody></tbody>';
    panel.appendChild(table);
    var tbody = table.querySelector('tbody');

    var nextIdx = stations.findIndex(function (st) { return !isStale(st.attributes.measurement_time); });

    stations.forEach(function (s, idx) {
      var a = s.attributes;
      var name = a.site_name || 'Jaam';
      var rt = a.road_temp != null ? parseFloat(a.road_temp) : null;
      var at = a.air_temp != null ? parseFloat(a.air_temp) : null;
      var sc = surfaceLabel(a.road_status);
      var slip = isSlippery(sc);
      var stale = isStale(a.measurement_time);
      var time = fmtTime(a.measurement_time);
      var age = fmtAge(a.measurement_time);
      // Camera readings may come from a nearby weather station
      var viaNote = (a._camera && a._via && a._via !== name && a._viaDist > 0)
        ? 'andmed: ' + a._via + ' (' + (+a._viaDist).toFixed(1) + ' km)' : '';
      if (stale) slip = false;

      var tr = document.createElement('tr');
      if (slip) tr.classList.add('slippery');
      if (stale) tr.classList.add('stale');
      if (idx === nextIdx) tr.classList.add('active');
      tr.innerHTML =
        '<td class="td-name">' +
          (idx === nextIdx ? '<span class="next-chip">JÄRGMINE</span><br>' : '') +
          esc(name) + (a._camera ? ' 📷' : '') + (slip ? ' ⚠️' : '') +
          '<div class="td-time' + (stale ? ' old' : '') + '">' +
            (stale ? 'Vananenud · ' : '') + time + '</div>' +
          (viaNote ? '<div class="td-time">' + esc(viaNote) + '</div>' : '') +
        '</td>' +
        '<td class="td-temp num ' + tempColor(rt) + '">' + fmtTemp(rt) + '</td>' +
        '<td class="td-temp num ' + tempColor(at) + '">' + fmtTemp(at) + '</td>' +
        '<td><span class="surface-pill pill-' + sc.cls + '">' + esc(sc.text) + '</span></td>';

      tr.addEventListener('click', function () {
        tbody.querySelectorAll('tr').forEach(function (r) { r.classList.remove('active'); });
        tr.classList.add('active');
        map.setView([s._lat, s._lng], 13);
        if (stationMarkers[idx]) stationMarkers[idx].openPopup();
        // On phones, bring the map back into view
        if (window.innerWidth < 768) window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      tbody.appendChild(tr);

      var marker = L.marker([s._lat, s._lng], {
        icon: stationIcon(stale ? '#a3a9bb' : stationIconColor(sc, rt))
      }).addTo(map);
      marker.bindPopup(
        '<b style="font-size:14px">' + esc(name) + (a._camera ? ' 📷' : '') + '</b>' +
        (viaNote ? '<div style="color:#6b7391">' + esc(viaNote) + '</div>' : '') +
        '<div style="color:' + (stale ? '#c0392b' : '#6b7391') + ';margin:2px 0 6px">' +
          (stale ? '<b>Vananenud andmed</b> · ' : 'Mõõdetud ') + time + (age ? ' (' + age + ')' : '') + '</div>' +
        '<div><b>Tee temp:</b> ' + fmtTemp(rt) + ' °C</div>' +
        '<div><b>Õhu temp:</b> ' + fmtTemp(at) + ' °C</div>' +
        '<div><b>Teekate:</b> ' + esc(sc.text) + (slip ? ' ⚠️' : '') + '</div>'
      );
      stationMarkers.push(marker);
    });
  }

  // ─── "My location" ────────────────────────────────────────────────────────
  var originInput = document.getElementById('origin');
  var gpsBtn = document.getElementById('gps-btn');

  function clearGps() {
    gpsCoord = null;
    gpsBtn.classList.remove('active');
    originInput.classList.remove('gps');
  }

  gpsBtn.addEventListener('click', function () {
    if (!('geolocation' in navigator)) { showToast('Seade ei toeta asukoha määramist'); return; }
    gpsBtn.disabled = true;
    setLoading(true, 'Määran asukohta…');
    navigator.geolocation.getCurrentPosition(function (pos) {
      gpsCoord = [pos.coords.longitude, pos.coords.latitude];
      originInput.value = 'Minu asukoht';
      originInput.classList.add('gps');
      gpsBtn.classList.add('active');
      if (gpsMarker) map.removeLayer(gpsMarker);
      gpsMarker = L.circleMarker([gpsCoord[1], gpsCoord[0]], {
        radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1
      }).addTo(map);
      map.setView([gpsCoord[1], gpsCoord[0]], 11);
      setLoading(false);
      gpsBtn.disabled = false;
    }, function (err) {
      setLoading(false);
      gpsBtn.disabled = false;
      showToast(err.code === 1
        ? 'Asukoha luba puudub. Luba see brauseri seadetes.'
        : 'Asukohta ei õnnestunud määrata');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });

  originInput.addEventListener('input', clearGps);
  originInput.addEventListener('focus', function () {
    if (gpsCoord) { originInput.value = ''; clearGps(); }
  });

  // ─── Main flow ────────────────────────────────────────────────────────────
  async function planRoute() {
    var origin = originInput.value.trim();
    var dest = document.getElementById('dest').value.trim();
    if ((!origin && !gpsCoord) || !dest) { showToast('Palun sisesta algus- ja sihtpunkt'); return; }

    document.activeElement && document.activeElement.blur(); // close phone keyboard

    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    stationMarkers.forEach(function (m) { map.removeLayer(m); });
    stationMarkers = [];

    var btn = document.getElementById('go-btn');
    btn.disabled = true;
    setDriveReady(false);
    try {
      setLoading(true, 'Otsin asukohti…');
      var coords2 = await Promise.all([
        gpsCoord ? Promise.resolve(gpsCoord) : geocode(origin),
        geocode(dest)
      ]);

      setLoading(true, 'Arvutan marsruuti…');
      var routeData = await getRoute(coords2[0], coords2[1]);
      var feat = routeData.features[0];
      var coords = feat.geometry.coordinates;
      var summary = feat.properties.summary;

      routeLayer = L.geoJSON(routeData, { style: { color: '#2a7d3f', weight: 5, opacity: 0.75 } }).addTo(map);
      map.invalidateSize();
      map.fitBounds(routeLayer.getBounds(), { padding: [24, 24] });

      var km = Math.round(summary.distance / 1000);
      var mins = Math.round(summary.duration / 60);
      document.getElementById('sum-dist').textContent = km + ' km';
      document.getElementById('sum-time').textContent =
        mins >= 60 ? Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min' : mins + ' min';

      setLoading(true, 'Laen Tarktee ilmajaamade ja kaamerate andmeid…');
      var results = await Promise.all([fetchWeatherStations(), fetchCameraStations()]);
      var stationFeatures = results[0].features;
      var cameraFeatures = results[1];

      var matched = buildMatched(stationFeatures, cameraFeatures, coords);

      // Keep the route and stations for driving mode
      currentRoute = makeRoute(coords, summary);
      routeStations = withAlong(matched, currentRoute);
      lastFetchOk = Date.now();
      setDriveReady(true);

      var staleCount = matched.filter(function (m) { return isStale(m.attributes.measurement_time); }).length;
      document.getElementById('sum-stations').textContent =
        matched.length + (matched.length === 1 ? ' jaam' : ' jaama') +
        (staleCount ? ' (' + staleCount + ' vananenud)' : '');
      document.getElementById('route-summary').classList.add('visible');
      renderStations(matched);
      return true;

    } catch (err) {
      showToast(err.name === 'AbortError' ? 'Päring aegus. Proovi uuesti.' : (err.message || 'Viga'));
      return false;
    } finally {
      setLoading(false);
      btn.disabled = false;
    }
  }

  // ─── UI helpers ───────────────────────────────────────────────────────────
  function setLoading(show, text) {
    document.getElementById('loading-text').textContent = text || '';
    document.getElementById('loading').classList.toggle('show', show);
  }
  var toastTimer;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4500);
  }

  document.getElementById('go-btn').addEventListener('click', planRoute);
  originInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('dest').focus(); }
  });
  document.getElementById('dest').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); planRoute(); }
  });

  // ═══════════════════════════════════════════════════════════════════════
  //  DRIVING MODE
  // ═══════════════════════════════════════════════════════════════════════

  // ─── Thresholds and timings (edit here) ─────────────────────────────────
  var DRIVE = {
    LOOKAHEAD_M:        30000,          // only stations within 30 km ahead count
    PASSED_TOL_M:       50,             // a station this far behind you is "passed"
    ICE_MAX_C:          0,              // road ≤ 0 °C  → ice rules
    CAUTION_MAX_C:      2,              // road 0…+2 °C → caution rule
    REMINDER_M:         2000,           // voice reminder at about 2 km
    GPS_INTERVAL_MS:    60 * 1000,      // read GPS every 60 s
    GPS_LOST_MS:        2 * 60 * 1000,  // no fix for 2 min → no data
    DATA_REFRESH_MS:    5 * 60 * 1000,  // re-fetch Tarktee every 5 min
    DATA_MAX_AGE_MS:    30 * 60 * 1000, // download older than 30 min → no data
    STATION_MAX_AGE_MS: 30 * 60 * 1000, // a station reading older than this is ignored
    TICK_MS:            15 * 1000,      // re-check ages / grey state
    MIN_SPEED_MS:       2,              // below ~7 km/h use route average speed
    SIM_INTERVAL_MS:    3000,           // simulation: move every 3 s
    SIM_STEP_M:         500,            // simulation: 500 m per step
    NOTICE_MS:          8000,           // one-time notices stay this long
    PX_PER_MM:          6.3             // CSS px per mm on a typical phone
  };
  var SIZE = {
    STATUS: Math.round(15 * DRIVE.PX_PER_MM),  // ≈ 15 mm
    DIST:   Math.round(12 * DRIVE.PX_PER_MM),  // ≈ 12 mm
    MIN:    Math.round(5 * DRIVE.PX_PER_MM)    // ≈ 5 mm
  };

  // ─── Status levels: colour + icon + word ─────────────────────────────────
  var ICONS = {
    ok:   '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 33 L27 46 L51 19"/></svg>',
    warn: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><path d="M32 7 L60 56 H4 Z"/><path d="M32 25 V39"/><circle cx="32" cy="48" r="1.5" fill="currentColor"/></svg>',
    ice:  '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6"><circle cx="32" cy="32" r="26"/><path d="M16 32 H48" stroke-width="10" stroke-linecap="round"/></svg>',
    none: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><circle cx="32" cy="32" r="26"/><path d="M24 25 a8 8 0 1 1 11 7 c-3 1.5 -3 3 -3 6"/><circle cx="32" cy="46" r="1.5" fill="currentColor"/></svg>'
  };
  var LEVELS = {
    OK:      { rank: 0, word: 'KORRAS',          cls: 's-ok',   icon: 'ok',   dist: 'c-ok' },
    CAUTION: { rank: 1, word: 'ETTEVAATUST',     cls: 's-warn', icon: 'warn', dist: 'c-warn' },
    ICE:     { rank: 2, word: 'JÄITEOHT',        cls: 's-ice',  icon: 'ice',  dist: 'c-ice' },
    NONE:    { rank: -1, word: 'ANDMED<br>PUUDUVAD', cls: 's-none', icon: 'none', dist: 'c-none' }
  };

  // ─── Precipitation (Tarktee field: precipitation_type, plus precipitation_intensity) ─
  var PRECIP_NONE = /^(NO_PRECIPITATION|NONE|NO|NOPRECIPITATION|UNKNOWN|DRY)$/;
  var PRECIP_FROZEN = /SNOW|SLEET|FREEZING|ICE|HAIL|GRAUPEL/;
  var PRECIP_WORDS = [
    [/FREEZING/, 'Jäävihm'], [/SLEET/, 'Lörts'], [/SNOW/, 'Lumi'],
    [/HAIL|GRAUPEL|ICE/, 'Rahe'], [/DRIZZLE/, 'Uduvihm'], [/RAIN/, 'Vihm']
  ];
  function precipWord(pt) {
    for (var i = 0; i < PRECIP_WORDS.length; i++) if (PRECIP_WORDS[i][0].test(pt)) return PRECIP_WORDS[i][1];
    return 'Sademed';
  }
  var SURFACE_WORDS = {
    DRY: 'kuiv', MOIST: 'niiske', WET: 'märg',
    MOIST_AND_CHEMICAL: 'soolaniiske', WET_AND_CHEMICAL: 'soolamärg'
  };

  function fmtDeg(t) {
    var r = Math.round(t);
    if (r === 0) return '0 °C';
    return (r < 0 ? '−' + Math.abs(r) : '+' + r) + ' °C';
  }

  // Classify one station reading → { level, kind, detail }
  function classify(a, now) {
    var t = a.measurement_time;
    if (!t || now - t > DRIVE.STATION_MAX_AGE_MS) return { level: 'NONE' };
    var rt = a.road_temp != null ? parseFloat(a.road_temp) : null;
    if (rt !== null && isNaN(rt)) rt = null;
    var s = String(a.road_status || '').toUpperCase();
    if (rt === null && !s) return { level: 'NONE' };

    var pt = String(a.precipitation_type || '').toUpperCase();
    var pi = a.precipitation_intensity != null ? parseFloat(a.precipitation_intensity) : 0;
    var precip = (pt && !PRECIP_NONE.test(pt)) || pi > 0;
    var frozenPrecip = precip && PRECIP_FROZEN.test(pt);
    var wet = s === 'MOIST' || s === 'WET';
    var chem = s === 'MOIST_AND_CHEMICAL' || s === 'WET_AND_CHEMICAL';
    var icyStatus = /ICE|ICY|SNOW|FROST|SLUSH/.test(s);   // in case Tarktee ever reports these
    var cold = rt !== null && rt <= DRIVE.ICE_MAX_C;
    var cool = rt !== null && rt > DRIVE.ICE_MAX_C && rt <= DRIVE.CAUTION_MAX_C;

    var level = 'OK', kind = 'ok';
    if ((cold && wet) || (cold && frozenPrecip) || icyStatus) { level = 'ICE'; kind = 'ice'; }
    else if ((cool && wet) || (cold && chem)) { level = 'CAUTION'; kind = 'surface'; }
    else if (precip) { level = 'CAUTION'; kind = 'precip'; }

    // Detail line, max 30 characters
    var parts = [];
    if (precip) parts.push(precipWord(pt));
    if (rt !== null) parts.push((precip ? 'tee ' : 'Tee ') + fmtDeg(rt));
    var sw = SURFACE_WORDS[s] || (s ? s.toLowerCase().replace(/_/g, ' ') : '');
    if (sw) parts.push(sw);
    var detail = parts.join(', ');
    if (detail.length > 30) detail = parts.slice(0, 2).join(', ');
    if (detail.length > 30) detail = detail.slice(0, 30);
    var short = parts.slice(0, 2).join(', ');     // used if the full line doesn't fit the screen
    return { level: level, kind: kind, frozen: frozenPrecip, detail: detail, short: short };
  }

  // ─── State ───────────────────────────────────────────────────────────────
  var drv = {
    on: false, sim: false, along: 0, lastAlongForSpeed: null,
    lastFixAt: 0, speed: null, timers: [], wakeLock: null,
    spoken: {}, dataLostSaid: false, voice: null, voiceReady: false,
    notices: [], noticeUntil: 0, lastGrey: false
  };

  // ─── Position on route ───────────────────────────────────────────────────
  function projectOnRoute(lat, lng) {
    var R = currentRoute, best = null;
    var px = lng * LNG_M, py = lat * LAT_M;
    for (var i = 0; i < R.coords.length - 1; i++) {
      var A = R.coords[i], B = R.coords[i + 1];
      var r = ptSeg(px, py, A[0] * LNG_M, A[1] * LAT_M, B[0] * LNG_M, B[1] * LAT_M);
      var along = R.cum[i] + r.t * R.seg[i];
      // Prefer forward matches so a route that doubles back doesn't jump you backwards
      var score = r.d + (along < drv.along - 300 ? 1000 : 0);
      if (!best || score < best.score) best = { score: score, d: r.d, along: along };
    }
    return best;
  }

  // ─── Speech (single entry point; swap for recorded clips later) ──────────
  function say(text) {
    if (!drv.voiceReady || !window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'et-EE';
    if (drv.voice) u.voice = drv.voice;
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }
  function pickEstonianVoice() {
    if (!window.speechSynthesis) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++) if (/^et([-_]|$)/i.test(vs[i].lang)) return vs[i];
    return null;
  }
  function initVoice(done) {
    if (!window.speechSynthesis) { done(null); return; }
    var v = pickEstonianVoice();
    if (v) { done(v); return; }
    // Voices load asynchronously on some browsers
    var finished = false;
    function finish() { if (finished) return; finished = true; done(pickEstonianVoice()); }
    window.speechSynthesis.addEventListener('voiceschanged', finish, { once: true });
    setTimeout(finish, 1500);
  }
  function hazardWord(h) {
    if (h.c.level === 'ICE') return 'Jäiteoht';
    return h.c.kind === 'precip' ? 'Sademed' : 'Libedusoht';
  }
  function kmWords(m) { return Math.max(1, Math.round(m / 1000)); }

  // ─── Text fitting (no animation; only when text or size changes) ─────────
  // Shrinks only when the text would not fit its width (or the given height)
  function setFit(el, html, maxPx, minPx, maxH) {
    if (el.dataset.t !== html) { el.innerHTML = html; el.dataset.t = html; }
    var size = maxPx;
    el.style.fontSize = size + 'px';
    while (size > minPx && (el.scrollWidth > el.clientWidth + 1 || (maxH && el.scrollHeight > maxH))) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }

  // ─── Evaluate and render ─────────────────────────────────────────────────
  var BAND_CLASS = { ICE: 'b-ice', CAUTION: 'b-warn', OK: 'b-ok', NONE: 'b-none' };
  var BAND_WORD  = { ICE: 'JÄITEOHT', CAUTION: 'ETTEVAATUST', OK: 'KORRAS', NONE: 'ANDMED PUUDUVAD' };

  function fmtTempShort(t) {
    if (t === null || t === undefined || isNaN(t)) return '—';
    var r = Math.round(t);
    return (r < 0 ? '−' + Math.abs(r) : r > 0 ? '+' + r : '0') + '°';
  }
  function fmtKm(m) { var km = Math.round(m / 1000); return km < 1 ? '&lt;1 km' : km + ' km'; }

  // Band rows: 1) icon + status word  2) distance · ETA  3) station · surface;  temperature on the right
  function renderBand(el, item, greyReason, isFirstEmpty) {
    var q = function (c) { return el.querySelector(c); };
    // Sizes follow the band's height so three bands always fit without scrolling
    var bh = Math.max(60, el.clientHeight - 16);
    var line = Math.max(18, Math.min(SIZE.MIN, Math.floor(bh / 3.4)));
    // Temperature stays large but leaves room for the distance line, which matters more
    var tempPx = Math.max(line, Math.min(56, Math.floor(bh * 0.5)));
    q('.b-word').style.fontSize = line + 'px';

    if (!item) {
      el.className = 'd-band b-empty';
      var ic = q('.b-ico'); ic.innerHTML = ''; ic.dataset.k = '';
      setFit(q('.b-temp'), '', tempPx, line);
      setFit(q('.b-dist'), '', line, 18);
      setFit(q('.b-det'), '', line, 18);
      setFit(q('.b-wtext'), isFirstEmpty ? 'Rohkem jaamu pole' : '', line, 18);
      return;
    }
    var a = item.st.attributes, c = item.c;
    var level = greyReason ? 'NONE' : c.level;
    el.className = 'd-band ' + BAND_CLASS[level];
    var rt = a.road_temp != null ? parseFloat(a.road_temp) : null;

    // Right column first, so the left column measures against its final width
    setFit(q('.b-temp'), level === 'NONE' ? '—' : fmtTempShort(rt), tempPx, line);

    var iconKey = LEVELS[level].icon;
    var ico = q('.b-ico');
    if (ico.dataset.k !== iconKey) { ico.innerHTML = ICONS[iconKey]; ico.dataset.k = iconKey; }
    setFit(q('.b-wtext'), BAND_WORD[level], line, 18);

    setFit(q('.b-dist'), fmtKm(item.dist) + (level === 'NONE' ? '' : ' · ' + fmtEta(item.dist)), line, 18);

    var name = a.site_name || 'Jaam', what;
    if (greyReason) what = greyReason;
    else if (level === 'NONE') what = a.measurement_time ? 'mõõdetud ' + fmtAge(a.measurement_time) : 'mõõtmised puuduvad';
    else {
      var s = String(a.road_status || '').toUpperCase();
      var pt = String(a.precipitation_type || '').toUpperCase();
      what = (c.kind === 'precip' || c.frozen) ? precipWord(pt).toLowerCase()
           : (SURFACE_WORDS[s] || (s ? s.toLowerCase().replace(/_/g, ' ') : 'teekate teadmata'));
    }
    var det = q('.b-det');
    setFit(det, esc((name + ' · ' + what).slice(0, 30)), line, 18);
    if (det.scrollWidth > det.clientWidth + 1) setFit(det, esc(what.slice(0, 30)), line, 18);
  }

  function evaluate() {
    if (!drv.on || !currentRoute) return;
    var now = Date.now();
    var gpsLost = !drv.sim && (!drv.lastFixAt || now - drv.lastFixAt > DRIVE.GPS_LOST_MS);
    var dataOld = !lastFetchOk || now - lastFetchOk > DRIVE.DATA_MAX_AGE_MS;

    // Stations ahead (any distance) for the bands; hazards within 30 km for voice
    var upcoming = [], hazards = [];
    routeStations.forEach(function (st) {
      var d = st._along - drv.along;
      if (d < -DRIVE.PASSED_TOL_M) return;
      var c = classify(st.attributes, now);
      var key = (st.attributes.site_name || '') + '|' + Math.round(st._along);
      var item = { st: st, c: c, dist: Math.max(0, d), key: key + '|' + c.level };
      upcoming.push(item);
      if (d <= DRIVE.LOOKAHEAD_M && (c.level === 'ICE' || c.level === 'CAUTION')) hazards.push(item);
    });
    hazards.sort(function (a, b) { return a.dist - b.dist; });

    var greyReason = gpsLost ? (drv.lastFixAt ? 'GPS puudub' : 'Ootan GPS-i')
                   : dataOld ? 'Andmed vananenud' : '';

    // Top bar: destination and km left
    var left = Math.max(0, currentRoute.total - drv.along);
    setFit(document.getElementById('d-dest'), esc(currentRoute.destName || 'Sihtpunkt') + ' · ' + fmtKm(left), SIZE.MIN, 20);

    // Three bands, fixed positions
    var firstEmpty = true;
    for (var i = 0; i < 3; i++) {
      var it = upcoming[i];
      renderBand(document.getElementById('d-band' + i), it, greyReason, !it && firstEmpty);
      if (!it) firstEmpty = false;
    }

    // Bottom line: one-time notices, otherwise data age + GPS
    if (drv.notices.length && now >= drv.noticeUntil) {
      drv.currentNotice = drv.notices.shift();
      drv.noticeUntil = now + DRIVE.NOTICE_MS;
    }
    var metaEl = document.getElementById('d-meta');
    if (drv.currentNotice && now < drv.noticeUntil) {
      metaEl.classList.remove('bad');
      setFit(metaEl, esc(drv.currentNotice), SIZE.MIN, 22);
    } else {
      drv.currentNotice = null;
      var ageMin = lastFetchOk ? Math.floor((now - lastFetchOk) / 60000) : null;
      var gpsTxt = drv.sim ? 'GPS sim' : (gpsLost ? 'GPS ✕' : 'GPS ✓');
      metaEl.classList.toggle('bad', gpsLost || dataOld);
      setFit(metaEl, 'Andmed ' + (ageMin === null ? '–' : ageMin + ' min') + ' · ' + gpsTxt, SIZE.MIN, 22);
    }

    // Voice
    if (greyReason) {
      if (!drv.dataLostSaid) { say('Teeolu andmed puuduvad.'); drv.dataLostSaid = true; }
    } else {
      drv.dataLostSaid = false;
      speakHazards(hazards);
    }
  }

  function speakHazards(hazards) {
    // New hazards: announce only the nearest new one; mark the rest so they get a 2 km reminder
    var firstNew = true;
    hazards.forEach(function (h) {
      var rec = drv.spoken[h.key];
      if (!rec) {
        rec = drv.spoken[h.key] = { count: 0, reminded: false };
        var near = h.dist <= DRIVE.REMINDER_M + 500;
        if (firstNew) {
          var w = hazardWord(h);
          say((h.c.level === 'ICE' || h.c.kind !== 'precip' ? 'Ettevaatust. ' : '') +
              w + ' ' + kmWords(h.dist) + ' kilomeetri pärast.');
          rec.count = 1;
          firstNew = false;
          if (near) { rec.reminded = true; }
        } else {
          rec.count = 1;
        }
        return;
      }
      if (!rec.reminded && rec.count < 2 && h.dist <= DRIVE.REMINDER_M + 300) {
        say(hazardWord(h) + ' ' + kmWords(h.dist) + ' kilomeetri pärast.');
        rec.reminded = true;
        rec.count++;
      }
    });
  }

  function currentSpeed() {
    if (!drv.sim && drv.speed && drv.speed >= DRIVE.MIN_SPEED_MS) return drv.speed;
    return currentRoute.avgSpeed;
  }
  function fmtEta(distM) {
    var min = Math.round(distM / currentSpeed() / 60);
    if (min < 1) return '~1 min';
    if (min < 60) return '~' + min + ' min';
    return '~' + Math.floor(min / 60) + ' h ' + (min % 60) + ' min';
  }

  // ─── GPS ─────────────────────────────────────────────────────────────────
  function onFix(pos) {
    if (!drv.on || drv.sim) return;
    var now = Date.now();
    var p = projectOnRoute(pos.coords.latitude, pos.coords.longitude);
    var prevAlong = drv.along, prevAt = drv.lastFixAt;
    drv.along = Math.max(0, p.along);
    // Speed: GPS speed if given, else from progress along the route
    if (pos.coords.speed != null && !isNaN(pos.coords.speed)) drv.speed = pos.coords.speed;
    else if (prevAt && now > prevAt) drv.speed = Math.max(0, (drv.along - prevAlong) / ((now - prevAt) / 1000));
    drv.lastFixAt = now;
    evaluate();
  }
  function readGps() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(onFix, function () { evaluate(); },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 });
  }

  // ─── Data refresh ────────────────────────────────────────────────────────
  async function refreshData() {
    if (!currentRoute) return;
    try {
      var results = await Promise.all([fetchWeatherStations(), fetchCameraStations()]);
      routeStations = withAlong(buildMatched(results[0].features, results[1], currentRoute.coords), currentRoute);
      lastFetchOk = Date.now();
    } catch (e) { /* keep old data; grey state appears after 30 min */ }
    evaluate();
  }

  // ─── Wake lock ───────────────────────────────────────────────────────────
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return false;
    try {
      drv.wakeLock = await navigator.wakeLock.request('screen');
      return true;
    } catch (e) { return false; }
  }
  document.addEventListener('visibilitychange', function () {
    if (drv.on && document.visibilityState === 'visible') {
      requestWakeLock();
      evaluate();
    }
  });

  // ─── Theme (light/dark button, remembered) ───────────────────────────────
  var THEME_KEY = 'teeolud-theme';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  function getTheme() { try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) { return 'dark'; } }
  function applyTheme(t) {
    var light = t === 'light';
    document.getElementById('drive').classList.toggle('light', light);
    // Shows what you switch TO
    document.getElementById('d-theme').innerHTML = light ? MOON : SUN;
  }
  document.getElementById('d-theme').addEventListener('click', function () {
    var t = getTheme() === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    applyTheme(t);
  });
  applyTheme(getTheme());

  // ─── Start / stop ────────────────────────────────────────────────────────
  var driveBtn = document.getElementById('drive-btn');
  var simToggle = document.getElementById('sim-toggle');
  var plannedKey = null;
  function routeKey() {
    return (gpsCoord ? gpsCoord.join(',') : originInput.value.trim().toLowerCase()) + '|' +
           document.getElementById('dest').value.trim().toLowerCase();
  }
  function setDriveReady(ready) {
    if (ready) {
      plannedKey = routeKey();
      if (currentRoute) currentRoute.destName = document.getElementById('dest').value.trim();
    }
  }
  function unlockAudio() {
    // iOS: speech must be started inside the tap itself
    if (!window.speechSynthesis) return;
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.lang = 'et-EE';
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // "Sõida": plans the route if needed, then starts driving mode
  async function onDriveTap() {
    if (drv.on) return;
    unlockAudio();
    if (!currentRoute || plannedKey !== routeKey()) {
      var ok = await planRoute();
      if (!ok) return;
    }
    startDriving();
  }

  function startDriving() {
    if (!currentRoute || drv.on) return;
    drv.on = true;
    drv.sim = simToggle.checked;
    drv.along = 0; drv.speed = null; drv.lastFixAt = 0;
    drv.spoken = {}; drv.dataLostSaid = false;
    drv.notices = []; drv.noticeUntil = 0; drv.currentNotice = null;
    applyTheme(getTheme());
    document.getElementById('drive').classList.add('on');
    document.body.style.overflow = 'hidden';

    if (!drv.sim) {
      if (navigator.geolocation) readGps();
      drv.timers.push(setInterval(readGps, DRIVE.GPS_INTERVAL_MS));
    } else {
      drv.timers.push(setInterval(function () {
        drv.along = Math.min(currentRoute.total, drv.along + DRIVE.SIM_STEP_M);
        evaluate();
      }, DRIVE.SIM_INTERVAL_MS));
    }
    drv.timers.push(setInterval(refreshData, DRIVE.DATA_REFRESH_MS));
    drv.timers.push(setInterval(evaluate, DRIVE.TICK_MS));

    requestWakeLock().then(function (ok) {
      if (!ok) drv.notices.push('Lülita automaatlukk välja');
      initVoice(function (v) {
        drv.voice = v;
        drv.voiceReady = !!v;
        if (!v) drv.notices.push('Eesti hääl puudub');
        evaluate();
      });
    });
    evaluate();
    if (Date.now() - lastFetchOk > DRIVE.DATA_REFRESH_MS) refreshData();
  }

  function stopDriving() {
    drv.on = false;
    drv.timers.forEach(clearInterval);
    drv.timers = [];
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (drv.wakeLock) { try { drv.wakeLock.release(); } catch (e) {} drv.wakeLock = null; }
    document.getElementById('drive').classList.remove('on');
    document.body.style.overflow = '';
  }

  driveBtn.addEventListener('click', onDriveTap);
  document.getElementById('d-stop').addEventListener('click', stopDriving);
  window.addEventListener('resize', function () {
    if (!drv.on) return;
    document.querySelectorAll('#drive .d-fit').forEach(function (el) { el.dataset.t = ''; });
    evaluate();
  });

  // Small hook for testing from the console: teeolud.drive
  window.teeolud = { drive: drv, evaluate: evaluate, DRIVE: DRIVE,
    stations: function () { return routeStations.map(function (s) { return [s.attributes.site_name, Math.round(s._along)]; }); } };

})();
</script>
</body>
